<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="dsh-skill-map — 把全部 skill 按自己的分类排进右侧栏">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d19"/>
      <stop offset="0.55" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#111b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .latin { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .han { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1030" cy="90" r="400" fill="url(#glow)"/>

  <!-- left: identity -->
  <g transform="translate(80,116)">
    <rect width="196" height="40" rx="20" fill="#4d6bfe" fill-opacity="0.16" stroke="#4d6bfe" stroke-opacity="0.38"/>
    <text x="98" y="26" class="latin" font-size="15" font-weight="600" letter-spacing="3.4" fill="#a9b6ff" text-anchor="middle">DSH PLUGIN</text>
  </g>

  <text x="78" y="272" class="latin" font-size="78" font-weight="700" letter-spacing="-2.4" fill="#f3f6ff">dsh-skill-map</text>

  <text x="82" y="342" class="han" font-size="31" font-weight="500" fill="#aab7d2">把全部 skill 按自己的分类排进右侧栏</text>
  <text x="82" y="390" class="latin" font-size="22" fill="#6f7d99">All your skills, sorted your way.</text>

  <line x1="82" y1="424" x2="566" y2="424" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <g class="han" font-size="17" fill="#6d7a92">
    <text x="82" y="462">多工作区切换</text>
    <text x="246" y="462">拖动改归属</text>
    <text x="376" y="462">模型补文案</text>
  </g>

  <text x="82" y="562" class="latin" font-size="17" fill="#4d5a72">github.com/kissfirembx/dsh-skill-map</text>

  <!-- right: panel mock -->
  <g transform="translate(680,118)">
    <rect width="440" height="394" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.10"/>

    <text x="32" y="46" class="han" font-size="20" font-weight="600" fill="#d7deee">技能地图</text>
    <circle cx="404" cy="40" r="9" fill="#ffffff" fill-opacity="0.10"/>
    <circle cx="404" cy="40" r="4" fill="#8ea2ff"/>

    <g transform="translate(32,68)">
      <rect width="376" height="60" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <path d="M18 22 l7 7 l-7 7" fill="none" stroke="#5b6a8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="37" class="han" font-size="21" fill="#e4eaf7">代码质量</text>
      <text x="356" y="37" class="latin" font-size="18" fill="#7d8aa5" text-anchor="end">4</text>
    </g>

    <g transform="translate(32,140)">
      <rect width="376" height="60" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <path d="M18 22 l7 7 l-7 7" fill="none" stroke="#5b6a8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="37" class="han" font-size="21" fill="#e4eaf7">文档处理</text>
      <text x="356" y="37" class="latin" font-size="18" fill="#7d8aa5" text-anchor="end">4</text>
    </g>

    <g transform="translate(32,212)">
      <rect width="376" height="60" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <path d="M18 22 l7 7 l-7 7" fill="none" stroke="#5b6a8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="37" class="han" font-size="21" fill="#e4eaf7">数据</text>
      <text x="356" y="37" class="latin" font-size="18" fill="#7d8aa5" text-anchor="end">2</text>
    </g>

    <g transform="translate(32,284)">
      <rect width="376" height="60" rx="12" fill="#4d6bfe" fill-opacity="0.10" stroke="#4d6bfe" stroke-opacity="0.30" stroke-dasharray="6 5"/>
      <path d="M18 22 l7 7 l-7 7" fill="none" stroke="#7f8dda" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="37" class="han" font-size="21" fill="#c9d3f5">未归类</text>
      <text x="356" y="37" class="latin" font-size="18" fill="#8b96c4" text-anchor="end">3</text>
    </g>

    <text x="32" y="374" class="han" font-size="15" fill="#5c6880">共 13 个 skill · 工作区 2</text>
  </g>
</svg>
