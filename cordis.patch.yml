# bundle patch for the skill-map plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-skill-map`.
- insert:
    - id: ui-skill-map
      name: '@coolwzy/dsh-skill-map'
